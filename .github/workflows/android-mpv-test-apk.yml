name: Android mpv test APK

on:
  push:
    branches: [android-mpv-fallback]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}

      - name: Build test APK
        run: flutter build apk --debug --flavor dev --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: absorb-dev-android-arm64
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
